<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Devolite | Pipelines</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
  <link rel="icon" href="/favicon_io/favicon.ico" sizes="any" />
  <link rel="manifest" href="/favicon_io/site.webmanifest" />

  <link rel="stylesheet" th:href="@{/css/app.css(v=${@environment.getProperty('app.assets.version','1')})}" />
</head>
<body data-pipeline-page="true" th:attr="data-pipeline-id=${pipeline.pipelineId}">
  <div class="app" style="grid-template-columns: 1fr; max-width: 1100px;">
    <main>
      <div class="header">
        <div>
          <h2 style="margin:0;">Pipelines</h2>
          <div class="note">Gestisci e apri le righe importate da CSV.</div>
        </div>
        <div class="header-actions">
          <a class="secondary" href="/dashboard">Dashboard</a>
          <a class="secondary" href="/intake">Torna alla scheda</a>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px;">
        <div class="grid" style="grid-template-columns: 1.2fr 1fr auto;">
          <div class="field" style="margin:0;">
            <label>Nome pipeline</label>
            <input type="text" data-pipeline-rename-name th:value="${pipeline.pipelineName}" placeholder="Pipeline Aprile 2026" />
            <div class="note">File: <span th:text="${pipeline.originalFilename}">pipeline.csv</span></div>
          </div>
          <div class="field" style="margin:0;">
            <label>Avanzamento</label>
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="badge" th:text="${pipeline.doneCount} + '/' + ${pipeline.activeRowCount}">0/0</div>
              <div class="note">Fatte / Attive</div>
            </div>
          </div>
          <div class="field" style="margin:0; display:flex; align-items:end;">
            <button type="button" class="primary" data-pipeline-rename-save>Salva nome</button>
          </div>
        </div>
        <div class="modal-status" data-pipeline-rename-status></div>
      </div>

      <div class="card">
        <div class="pipeline-view-switch" style="margin-bottom:12px;">
          <button type="button" class="secondary is-active" data-pipeline-view-btn data-view="cards">Vista schede</button>
          <button type="button" class="secondary" data-pipeline-view-btn data-view="table">Vista tabella</button>
        </div>
        <div class="modal-search" style="margin-bottom:12px;">
          <input type="text" data-pipeline-row-search placeholder="Cerca per progetto, azienda, contatto, email, telefono" />
          <div style="display:flex; gap:10px; align-items:end;">
            <div class="field" style="margin:0;">
              <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:6px;">Ordina per</label>
              <select data-pipeline-row-sort-by>
                <option value="rowNumber">Riga</option>
                <option value="projectName">Nome progetto</option>
                <option value="companyName">Azienda</option>
                <option value="contactEmail">Email</option>
                <option value="crmTemperature">Temperatura</option>
                <option value="done">Fatto</option>
                <option value="updatedAt">Aggiornamento</option>
              </select>
            </div>
            <div class="field" style="margin:0;">
              <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:6px;">Direzione</label>
              <select data-pipeline-row-sort-dir>
                <option value="asc">Crescente</option>
                <option value="desc">Decrescente</option>
              </select>
            </div>
          </div>
        </div>

        <input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}" />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="modal-status" data-pipeline-row-status></div>
        <div class="modal-list" data-pipeline-row-list style="max-height: calc(100vh - 360px);">
          <div class="modal-empty">Caricamento...</div>
        </div>
        <div class="pipeline-table-wrap" data-pipeline-table-wrap hidden>
          <div class="pipeline-table-scroller">
            <table class="pipeline-table" data-pipeline-table>
              <thead data-pipeline-table-head></thead>
              <tbody data-pipeline-table-body>
                <tr>
                  <td class="modal-empty" colspan="20">Caricamento...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script th:src="@{/js/app.js(v=${@environment.getProperty('app.assets.version','1')})}"></script>
</body>
</html>
