spring.application.name=ai-client-form
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${APP_PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.http2.enabled=true
server.shutdown=graceful
server.tomcat.max-part-count=${APP_TOMCAT_MAX_PART_COUNT:2000}
server.tomcat.max-parameter-count=${APP_TOMCAT_MAX_PARAMETER_COUNT:2000}

spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acf_db_qa}
spring.datasource.username=${DB_USER:acf_qa_app_user}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_QA_APP}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.thymeleaf.cache=true
spring.web.error.whitelabel.enabled=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:25MB}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

app.storage.root=${APP_STORAGE_ROOT:./storage}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:asdasd}
app.admin.full-name=${APP_ADMIN_FULLNAME:Admin User}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}
app.security.require-https=${APP_REQUIRE_HTTPS:false}
app.security.trust-forwarded-headers=${APP_TRUST_FORWARDED_HEADERS:false}
app.security.redirect-host=${APP_REDIRECT_HOST:}
app.intake.enforce-section-order=true
app.intake.prefill-samples=${APP_PREFILL_SAMPLES:false}
app.assets.version=${APP_ASSETS_VERSION:1}

